kind = "mobile"
previewPath = "/mobile/"
title = "Mean & Variance Calculator"
description = "A mobile calculator for arranging nine values in a 3×3 grid and viewing their mean, variance, standard deviation, minimum, maximum, and sum by row, column, and overall."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
